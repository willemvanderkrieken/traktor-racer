services:
  traktor:
    build: .                 # bouwt de Node-image uit de Dockerfile in deze map
    image: traktor-racer
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - STATS_KEY=${STATS_KEY:-changeme}   # zet in Coolify een eigen geheime sleutel
    volumes:
      - traktor-stats:/data  # bewaart de statistieken tussen deploys

volumes:
  traktor-stats:
