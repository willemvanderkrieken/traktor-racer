services:
  traktor:
    build: .                 # bouwt de Node-image uit de Dockerfile in deze map
    image: traktor-racer
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Optionele secrets. Zet ze desgewenst in Coolify als eigen env-vars (sterke willekeurige waarden).
      # Zo niet, dan genereert de server zelf een sterk secret en bewaart dat in /data (nooit uit de repo).
      - STATS_KEY=${STATS_KEY:-}        # beschermt de /stats-pagina (leeg = /stats blijft dicht)
      - SIGN_SECRET=${SIGN_SECRET:-}    # ondertekent de run-tokens (leeg = auto-gegenereerd + bewaard)
      - ALLOW_ORIGIN=${ALLOW_ORIGIN:-https://totrit.inboekel.nl}    # CORS: alleen de eigen origin
    volumes:
      - traktor-stats:/data  # bewaart de statistieken + scores tussen deploys

volumes:
  traktor-stats:
